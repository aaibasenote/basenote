<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<script src="https://cdn.jsdelivr.net/npm/coi-serviceworker@0.1.7/coi-serviceworker.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Basenote</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ─── Reset & Variables ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:   #4F46E5;
  --accent-h: #3730a3;
  --cancel:   #202632;
  --bg:       #ffffff;
  --surface:  #f8f9fc;
  --card:     #f1f3f8;
  --border:   #e2e5ee;
  --text:     #1a1d2a;
  --muted:    #8890a4;
  --success:  #10b981;
  --danger:   #ef4444;
  --warn:     #f59e0b;
  --radius:   14px;
  --radius-sm:8px;
  --font: 'Pretendard', -apple-system, sans-serif;
  --shadow: 0 4px 24px rgba(0,0,0,.08);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

/* ─── Utilities ─── */
.hidden { display: none !important; }
.sr-only { position: absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

button {
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all .15s ease;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  -webkit-tap-highlight-color: transparent;
}
button:active { transform: scale(.96); }

.btn-primary {
  background: var(--accent);
  color: #fff;
  padding: 13px 24px;
}
.btn-primary:hover { background: var(--accent-h); }

.btn-secondary {
  background: var(--cancel);
  color: var(--muted);
  padding: 10px 18px;
  border: 1px solid var(--border);
}
.btn-secondary:hover { color: var(--text); border-color: var(--muted); }

.btn-ghost {
  background: transparent;
  color: var(--muted);
  padding: 8px 12px;
}
.btn-ghost:hover { color: var(--text); background: var(--card); }

.btn-danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
  padding: 7px 14px;
  font-size: 12px;
}
.btn-danger:hover { background: rgba(239,68,68,.1); }

.btn-sm { padding: 7px 14px; font-size: 12px; }

input[type="text"], input[type="url"], input[type="password"] {
  font-family: var(--font);
  font-size: 14px;
  background: #ffffff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 12px 14px;
  width: 100%;
  outline: none;
  transition: border-color .2s;
}
input:focus { border-color: var(--accent); }
input::placeholder { color: var(--muted); }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ─── Toast ─── */
#toast-container {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  width: calc(100% - 32px);
  max-width: 380px;
}
.toast {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  animation: toastIn .25s ease forwards;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error   { border-left: 3px solid var(--danger); }
.toast.info    { border-left: 3px solid var(--accent); }
@keyframes toastIn {
  from { opacity:0; transform: translateY(-10px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes toastOut {
  to { opacity:0; transform: translateY(-10px); }
}

/* ─── Loader ─── */
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Screen: Login ─── */
#screen-login {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px 48px;
  background: var(--bg);
  overflow-y: auto;
}

.login-logo {
  margin-bottom: 40px;
  text-align: center;
}
.login-logo .logo-mark {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--accent), #818cf8);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  box-shadow: 0 8px 32px rgba(79,70,229,.4);
}
.login-logo .logo-mark svg { width: 32px; height: 32px; }
.login-logo h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -.5px;
}
.login-logo p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 6px;
}

/* Auth card wrapper */
.auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 360px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* Tab switcher inside card */
.auth-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
}
.auth-tab-btn {
  flex: 1;
  padding: 14px 0;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  border-radius: 0;
  border-bottom: 2px solid transparent;
  transition: all .2s;
}
.auth-tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: transparent;
}

/* Panel inside auth card */
.auth-panel { display: none; padding: 24px 24px 36px; }
.auth-panel.active { display: block; }

.auth-panel label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 8px;
  margin-top: 14px;
}
.auth-panel label:first-child { margin-top: 0; }

.auth-msg {
  font-size: 13px;
  font-weight: 500;
  min-height: 20px;
  margin-top: 10px;
  text-align: center;
}
.auth-msg.error  { color: var(--danger); }
.auth-msg.success{ color: var(--success); }


/* ─── Screen: Main ─── */
#screen-main {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ─── Top Bar ─── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 14px 18px 0;
  flex-shrink: 0;
}
.user-badge {
  font-size: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 220px;
  overflow: hidden;
}
#topbar-user {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}
.user-dot {
  width: 7px; height: 7px;
  background: var(--success);
  border-radius: 50%;
  flex-shrink: 0;
}

/* ─── Tabs ─── */
.tab-bar {
  display: flex;
  padding: 14px 16px 0;
  gap: 4px;
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 10px 6px;
  background: transparent;
  color: var(--muted);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  position: relative;
  transition: all .2s;
  flex-direction: column;
  gap: 3px;
  border: 1.5px solid transparent;
}
.tab-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.tab-btn span { font-size: 11px; }
.tab-btn.active {
  background: var(--card);
  color: var(--text);
  border-color: var(--border);
}
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 20%; right: 20%;
  height: 2px;
  background: var(--accent);
  border-radius: 2px;
}

/* ─── Tab Content ─── */
.tab-content {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.tab-panel {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 16px;
  display: none;
}
.tab-panel.active { display: block; }

/* ─── Section Card ─── */
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
}
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title svg { width: 14px; height: 14px; }

/* ─── Connect Tab ─── */
.connect-form { display: flex; flex-direction: column; gap: 10px; }
.connect-form .row { display: flex; gap: 8px; }
.connect-form .row input { flex: 1; }

.doc-list { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
.doc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
}
.doc-icon {
  width: 32px; height: 32px;
  background: rgba(79,70,229,.15);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.doc-icon svg { width: 16px; height: 16px; color: var(--accent); }
.doc-info { flex: 1; min-width: 0; }
.doc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.doc-item button { flex-shrink: 0; }

.empty-state {
  text-align: center;
  padding: 28px 16px;
  color: var(--muted);
}
.empty-state svg { width: 36px; height: 36px; margin: 0 auto 10px; opacity: .4; display: block; }
.empty-state p { font-size: 13px; }

/* ─── Share Tab ─── */
.user-list { display: flex; flex-direction: column; gap: 8px; }
.user-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #818cf8);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
  color: #fff;
}
.user-name { font-size: 14px; font-weight: 600; }
.user-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }
.user-item-actions { margin-left: auto; display: flex; gap: 6px; }

.share-search { display: flex; gap: 8px; margin-bottom: 14px; }
.share-search input { flex: 1; }

.badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.badge-accent { background: rgba(79,70,229,.2); color: #818cf8; }
.badge-success { background: rgba(16,185,129,.2); color: var(--success); }

/* ─── Chat Tab ─── */
#panel-chat {
  display: none;
  flex-direction: column;
  padding: 0;
}
#panel-chat.active { display: flex; }

.chat-kb-bar {
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-kb-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 8px;
}
.kb-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.kb-chip {
  font-size: 12px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 20px;
  background: var(--card);
  border: 1.5px solid var(--border);
  cursor: pointer;
  transition: all .15s;
  color: var(--muted);
  -webkit-tap-highlight-color: transparent;
}
.kb-chip.selected {
  background: rgba(79,70,229,.2);
  border-color: var(--accent);
  color: #818cf8;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  display: flex;
  gap: 8px;
  max-width: 88%;
  animation: msgIn .2s ease;
}
@keyframes msgIn {
  from { opacity:0; transform:translateY(6px); }
  to   { opacity:1; transform:translateY(0); }
}
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.assistant { align-self: flex-start; }

.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}
.msg.user .msg-avatar    { background: var(--accent); color: #fff; }
.msg.assistant .msg-avatar { background: var(--card); border: 1px solid var(--border); color: var(--muted); }

.msg-bubble {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user .msg-bubble {
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.assistant .msg-bubble {
  background: var(--card);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  color: var(--text);
}

.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 12px 14px;
  align-items: center;
}
.typing-dot {
  width: 6px; height: 6px;
  background: var(--muted);
  border-radius: 50%;
  animation: typingDot 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }
@keyframes typingDot {
  0%, 80%, 100% { transform: scale(.6); opacity: .4; }
  40% { transform: scale(1); opacity: 1; }
}

.thinking-text {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
  animation: thinkingPulse 1.4s ease-in-out infinite;
}
@keyframes thinkingPulse {
  0%, 100% { opacity: .35; }
  50% { opacity: .9; }
}

.chat-input-area {
  padding: 12px 16px;
  padding-bottom: calc(12px + var(--safe-bottom));
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  background: var(--bg);
}
.chat-input-wrap { flex: 1; position: relative; }
#chat-input {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  padding: 11px 16px;
  outline: none;
  resize: none;
  max-height: 120px;
  line-height: 1.4;
  display: block;
  transition: border-color .2s;
}
#chat-input:focus { border-color: var(--accent); }

.send-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  flex-shrink: 0;
  padding: 0;
  align-self: flex-end;
  transition: all .15s;
}
.send-btn:hover { background: var(--accent-h); }
.send-btn:disabled { opacity: .5; cursor: not-allowed; }
.send-btn svg { width: 18px; height: 18px; }

/* ─── Model selector ─── */
.model-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.model-row label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.model-row select {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 8px 10px;
  outline: none;
  cursor: pointer;
}

/* ─── Divider ─── */
.divider { height: 1px; background: var(--border); margin: 14px 0; }

/* ─── Status pill ─── */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--border);
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; }
.status-pill.ok .status-dot   { background: var(--success); }
.status-pill.err .status-dot  { background: var(--danger); }
.status-pill.warn .status-dot { background: var(--warn); }
</style>

<!-- Worker 소스: type=text/js-worker 로 실행 방지, JS에서 텍스트로 읽어 Blob Worker 생성 -->
<script id="worker-src" type="text/js-worker">
// ── Basenote Inference Worker ──
// classic Worker이므로 동적 import() 사용 가능 (최신 브라우저 지원)
let pipe = null;

async function loadModel(payload, id) {
  try {
    self.postMessage({ type: 'status', kind: 'warn', text: '라이브러리 로딩 중...' });

    const mod = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3/dist/transformers.min.js');
    const { pipeline, env } = mod;
    env.allowRemoteModels = true;
    // ★ 싱글스레드 강제 → SharedArrayBuffer 불필요 → 안드로이드 크롬 호환
    env.backends.onnx.wasm.numThreads = Math.min(navigator.hardwareConcurrency || 4, 4);

    self.postMessage({ type: 'status', kind: 'warn', text: '모델 다운로드 중...' });

    pipe = await pipeline('text-generation', payload.modelId, {
      dtype: 'uint8',
      device: 'wasm',
      progress_callback: (() => {
        // 파일별 loaded/total 바이트를 추적 → 전체 합산으로 정확한 % 계산
        const fileLoaded = {}; // { [name]: bytes received }
        const fileTotal  = {}; // { [name]: total bytes }
        return (p) => {
          if (!p.name) {
            if (p.status === 'loading')
              self.postMessage({ type: 'status', kind: 'warn', text: '모델 초기화 중...' });
            return;
          }
          if (p.status === 'initiate') {
            fileLoaded[p.name] = 0;
            fileTotal[p.name]  = p.total || 0;
          } else if (p.status === 'progress') {
            if (typeof p.loaded === 'number') fileLoaded[p.name] = p.loaded;
            if (typeof p.total  === 'number' && p.total > 0) fileTotal[p.name] = p.total;
          } else if (p.status === 'done') {
            fileLoaded[p.name] = fileTotal[p.name] || fileLoaded[p.name] || 0;
          } else {
            return;
          }
          const totalBytes  = Object.values(fileTotal).reduce((a, b) => a + b, 0);
          const loadedBytes = Object.values(fileLoaded).reduce((a, b) => a + b, 0);
          if (totalBytes <= 0) {
            self.postMessage({ type: 'status', kind: 'warn', text: '다운로드 중...' });
            return;
          }
          const pct = Math.min(99, Math.round(loadedBytes / totalBytes * 100));
          const loadedMB = (loadedBytes / 1024 / 1024).toFixed(0);
          const totalMB  = (totalBytes  / 1024 / 1024).toFixed(0);
          self.postMessage({ type: 'status', kind: 'warn', text: `다운로드 ${pct}% (${loadedMB}/${totalMB}MB)` });
        };
      })(),
    });

    self.postMessage({ type: 'status', kind: 'ok', text: '모델 준비 완료' });
    self.postMessage({ type: 'load_ok', id });
  } catch (err) {
    self.postMessage({ type: 'load_err', id, error: (err && (err.message || String(err))) || '모델 로딩 실패' });
  }
}

async function runInfer(payload, id) {
  if (!pipe) {
    self.postMessage({ type: 'infer_err', id, error: '모델이 아직 준비되지 않았어요.' });
    return;
  }
  try {
    const output = await pipe(payload.messages, {
      max_new_tokens: payload.maxTokens || 256,
      temperature: payload.temperature != null ? payload.temperature : 0.4,
      do_sample: true,
    });
    self.postMessage({ type: 'infer_ok', id, output });
  } catch (err) {
    self.postMessage({ type: 'infer_err', id, error: (err && (err.message || String(err))) || '추론 실패' });
  }
}

self.onmessage = (e) => {
  const { type, payload, id } = e.data;
  if (type === 'load')  loadModel(payload, id);
  if (type === 'infer') runInfer(payload, id);
};
</script>

<body>

<div id="toast-container"></div>

<script>
/* ════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════ */
const state = {
  serverUrl: 'https://basenote.cloud',
  userId: '',
  docs: [],
  shareInfo: { sent: [], received: [] },
  selectedKBs: [],
  kbTextCache: {},
  chatHistory: [],
  isStreaming: false,
  engine: null,
  _engineReady: null,
  modelProgress: { percent: 0, stage: 'idle' },
  model: {
    id: 'onnx-community/gemma-2-2b-it-post-training-quantized-onnx',
    label: 'Llama 3.2 1B',
    ready: false,
    loading: false,
    error: '',
    temperature: 0.4,
    maxTokens: 256,
  },
};

/* ════════════════════════════════════════════════
   API
════════════════════════════════════════════════ */
const api = {
  base: () => state.serverUrl,

  async call(path, opts = {}) {
    const url = api.base() + path;
    const res = await fetch(url, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || '서버 오류');
    }
    return res;
  },

  async json(path, opts = {}) {
    const res = await api.call(path, opts);
    return res.json();
  },

  async register(userId, password) {
    return api.json('/api/register', {
      method: 'POST',
      body: JSON.stringify({ user_id: userId, password }),
    });
  },

  async login(userId, password) {
    return api.json('/api/login', {
      method: 'POST',
      body: JSON.stringify({ user_id: userId, password }),
    });
  },

  async kbConnect(driveUrl, docName) {
    return api.json('/api/kb/connect', {
      method: 'POST',
      body: JSON.stringify({ user_id: state.userId, drive_url: driveUrl, doc_name: docName || null }),
    });
  },

  async kbList(userId) {
    return api.json(`/api/kb/list/${userId}`);
  },

  async kbContent(ownerId, docName) {
    return api.json(`/api/kb/content/${state.userId}/${ownerId}/${encodeURIComponent(docName)}`);
  },

  async kbDelete(docName) {
    return api.json(`/api/kb/${state.userId}/${docName}`, { method: 'DELETE' });
  },

  async shareInfo(userId) {
    return api.json(`/api/share/${userId}`);
  },

  async shareSend(toUser) {
    return api.json('/api/share/send', {
      method: 'POST',
      body: JSON.stringify({ from_user: state.userId, to_user: toUser }),
    });
  },

  async shareRevoke(toUser) {
    return api.json('/api/share/revoke', {
      method: 'POST',
      body: JSON.stringify({ from_user: state.userId, to_user: toUser }),
    });
  },

  async users() {
    return api.json('/api/users');
  },
};

/* ════════════════════════════════════════════════
   ON-DEVICE MODEL — WebWorker 분리 버전
   메인 스레드 블로킹 없이 WASM 추론 실행
════════════════════════════════════════════════ */
function setModelStatus(kind, text) {
  const pill = document.getElementById('model-status');
  const label = document.getElementById('model-status-text');
  if (!pill || !label) return;
  pill.className = `status-pill ${kind}`;
  label.textContent = text;
}

function getErrorMessage(error) {
  if (!error) return '알 수 없는 오류로 모델 로딩에 실패했어요.';
  if (typeof error === 'string') return error;
  if (error.message) return error.message;
  return String(error);
}

// ── Worker 생성 (classic Worker + Blob URL) ────────────
// <script id="worker-src" type="text/js-worker"> 태그에서 소스 읽기
// type: 'module' 제거 → Blob origin 에서 import() CORS 문제 해결
let _worker = null;
let _workerReady = null;
const _pending = new Map();
let _msgId = 0;

function getWorker() {
  if (_worker) return _worker;

  const workerCode = document.getElementById('worker-src').textContent;
  const blob = new Blob([workerCode], { type: 'application/javascript' });
  const url  = URL.createObjectURL(blob);
  // ★ type: 'module' 없이 classic Worker 로 생성 — import() 는 내부에서 동적으로 사용
  _worker = new Worker(url);

  _worker.onmessage = (e) => {
    const { type, kind, text, id, output, error } = e.data;
    if (type === 'status') {
      setModelStatus(kind, text);
      return;
    }
    const p = _pending.get(id);
    if (!p) return;
    _pending.delete(id);
    if (type === 'load_ok')   p.resolve();
    if (type === 'load_err')  p.reject(new Error(error));
    if (type === 'infer_ok')  p.resolve(output);
    if (type === 'infer_err') p.reject(new Error(error));
  };

  _worker.onerror = (e) => {
    // 에러 상세 정보를 최대한 수집
    const msg = e.message || (e.error && e.error.message) || '알 수 없는 Worker 오류';
    const loc  = (e.filename ? ` (${e.filename}:${e.lineno})` : '');
    console.error('[Worker onerror]', e);
    setModelStatus('err', '로딩 실패');
    toast('Worker 오류: ' + msg + loc, 'error');
    // 대기 중인 promise 모두 reject
    _pending.forEach(p => p.reject(new Error(msg)));
    _pending.clear();
    _workerReady = null;
    _worker = null;
    e.preventDefault?.();
  };

  return _worker;
}

function workerCall(type, payload) {
  return new Promise((resolve, reject) => {
    const id = ++_msgId;
    _pending.set(id, { resolve, reject });
    getWorker().postMessage({ type, payload, id });
  });
}

function resetModelRuntime() {
  if (_worker) { _worker.terminate(); _worker = null; }
  _workerReady = null;
  _pending.clear();
  state.model.ready = false;
  state.model.loading = false;
  state.model.error = '';
  setModelStatus('warn', '모델 준비 전');
}

function ensureModelReady() {
  if (_workerReady) return _workerReady;
  state.model.loading = true;
  state.model.error = '';

  _workerReady = workerCall('load', {
    modelId: state.model.id,
    dtype: 'q4f16',
  }).then(() => {
    state.model.ready = true;
    state.model.loading = false;
    setModelStatus('ok', '모델 준비 완료');
  }).catch((err) => {
    _workerReady = null;
    state.model.loading = false;
    state.model.ready = false;
    state.model.error = err.message;
    setModelStatus('err', '로딩 실패');
    throw err;
  });

  return _workerReady;
}

/* ════════════════════════════════════════════════
   TOAST
════════════════════════════════════════════════ */
function toast(msg, type = 'info', duration = 3000) {
  const icon = { success: '✓', error: '✕', info: 'ℹ' }[type] || 'ℹ';
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span style="font-weight:700;flex-shrink:0">${icon}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut .25s ease forwards';
    setTimeout(() => el.remove(), 250);
  }, duration);
}

/* ════════════════════════════════════════════════
   SCREENS
════════════════════════════════════════════════ */
function showMain() {
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('screen-main').classList.remove('hidden');
  document.getElementById('topbar-user').textContent = state.userId;
}

/* ════════════════════════════════════════════════
   TABS
════════════════════════════════════════════════ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`panel-${tab}`).classList.add('active');
    if (tab === 'share') loadShareData();
    if (tab === 'connect') loadDocs();
    if (tab === 'chat') {
      loadChatKBChips();
      if (!state.model.ready) {
        const sendBtn = document.getElementById('send-btn');
        sendBtn.disabled = true;
        ensureModelReady()
          .catch(err => {
            console.error(err);
            toast(err.message || '모델 로딩 실패', 'error');
          })
          .finally(() => {
            if (!state.isStreaming) sendBtn.disabled = false;
          });
      }
    }
  });
});

/* ════════════════════════════════════════════════
   AUTH (LOGIN / REGISTER)
════════════════════════════════════════════════ */
function switchAuthTab(tab) {
  document.getElementById('auth-panel-login').classList.toggle('active', tab === 'login');
  document.getElementById('auth-panel-register').classList.toggle('active', tab === 'register');
  document.getElementById('tab-login-btn').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register-btn').classList.toggle('active', tab === 'register');
  document.getElementById('login-msg').textContent = '';
  document.getElementById('register-msg').textContent = '';
}

function setAuthMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'auth-msg ' + type;
}

async function doLogin() {
  const uid = document.getElementById('login-id').value.trim();
  const pw  = document.getElementById('login-pw').value;

  if (!uid) { setAuthMsg('login-msg', '아이디를 입력해주세요', 'error'); return; }
  if (!pw)  { setAuthMsg('login-msg', '비밀번호를 입력해주세요', 'error'); return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    await api.login(uid, pw);
    state.userId = uid;
    showMain();
    loadDocs();
    loadShareData();
  } catch (e) {
    setAuthMsg('login-msg', e.message || '서버에 연결할 수 없어요', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '로그인';
  }
}

async function doRegister() {
  const uid  = document.getElementById('reg-id').value.trim();
  const pw   = document.getElementById('reg-pw').value;
  const pw2  = document.getElementById('reg-pw2').value;

  if (!uid) { setAuthMsg('register-msg', '아이디를 입력해주세요', 'error'); return; }
  if (!pw)  { setAuthMsg('register-msg', '비밀번호를 입력해주세요', 'error'); return; }
  if (pw !== pw2) { setAuthMsg('register-msg', '비밀번호를 다시 확인해주세요', 'error'); return; }

  const btn = document.getElementById('register-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    await api.register(uid, pw);
    setAuthMsg('register-msg', '가입이 완료되었어요', 'success');
    // Auto-switch to login after short delay
    setTimeout(() => switchAuthTab('login'), 1200);
  } catch (e) {
    const msg = e.message || '서버에 연결할 수 없어요';
    setAuthMsg('register-msg', msg.includes('존재하는') ? '이미 존재하는 계정이에요' : msg, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '가입하기';
  }
}

async function searchAndShare() {
  const q = document.getElementById('share-search-input').value.trim();
  if (!q) { toast('아이디를 입력해주세요', 'error'); return; }

  const resultsDiv = document.getElementById('share-search-results');
  resultsDiv.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0;">검색 중...</div>';

  try {
    const data = await api.users();
    const matches = data.users.filter(u =>
      u !== state.userId && u.toLowerCase().includes(q.toLowerCase())
    );

    if (!matches.length) {
      resultsDiv.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:8px 0;">
        "${esc(q)}"와 일치하는 사용자가 없어요</div>`;
      return;
    }

    resultsDiv.innerHTML = `<div class="user-list" style="margin-top:10px;">${matches.map(u => {
      const alreadySent = state.shareInfo.sent.includes(u);
      return `
        <div class="user-item">
          <div class="avatar">${u[0].toUpperCase()}</div>
          <div>
            <div class="user-name">${esc(u)}</div>
            <div class="user-sub">${alreadySent ? '이미 공유 중' : '공유 가능'}</div>
          </div>
          <div class="user-item-actions">
            ${alreadySent
              ? `<span class="badge badge-accent">공유 중</span>`
              : `<button class="btn-primary btn-sm" onclick="sendShare('${esc(u)}')">공유하기</button>`}
          </div>
        </div>`;
    }).join('')}</div>`;
  } catch (e) {
    resultsDiv.innerHTML = '';
    toast(e.message, 'error');
  }
}

async function loadChatKBChips() {
  const chips = document.getElementById('kb-chips');
  chips.innerHTML = '<span style="font-size:12px;color:var(--muted)">로딩 중...</span>';

  // Collect all accessible KBs: own + received
  const owners = [state.userId, ...state.shareInfo.received];
  const chipItems = [];

  for (const owner of owners) {
    try {
      const data = await api.kbList(owner);
      if (data.docs.length) {
        chipItems.push({
          userId: owner,
          label: owner === state.userId ? '내 KB' : `${owner}의 KB`,
          count: data.docs.length,
        });
      }
    } catch (e) {}
  }

  if (!chipItems.length) {
    chips.innerHTML = '<span style="font-size:12px;color:var(--muted)">연결된 지식베이스가 없어요</span>';
    return;
  }

  chips.innerHTML = chipItems.map(item => `
    <div class="kb-chip ${state.selectedKBs.includes(item.userId) ? 'selected' : ''}"
         data-uid="${esc(item.userId)}"
         onclick="toggleKB(this, '${esc(item.userId)}')">
      ${esc(item.label)} <span style="opacity:.6">${item.count}</span>
    </div>`).join('');
}

function toggleKB(el, uid) {
  const idx = state.selectedKBs.indexOf(uid);
  if (idx === -1) {
    state.selectedKBs.push(uid);
    el.classList.add('selected');
  } else {
    state.selectedKBs.splice(idx, 1);
    el.classList.remove('selected');
  }
}

function chunkText(text, size = 500, overlap = 50) {
  const chunks = [];
  let start = 0;
  while (start < text.length) {
    const end = start + size;
    chunks.push(text.slice(start, end));
    start += size - overlap;
  }
  return chunks;
}

function simpleRagSearch(query, kbTexts, topK = 5) {
  const terms = new Set(
    query
      .toLowerCase()
      .replace(/[^\p{L}\p{N}_]+/gu, ' ')
      .split(/\s+/)
      .filter(Boolean)
  );
  const scored = kbTexts
    .map(chunk => {
      const lower = chunk.toLowerCase();
      let score = 0;
      for (const term of terms) {
        if (lower.includes(term)) score += 1;
      }
      return { score, chunk };
    })
    .sort((a, b) => b.score - a.score);
  return scored.filter(item => item.score > 0).slice(0, topK).map(item => item.chunk);
}

function buildSystemPrompt() {
  const basePrompt = `당신은 Basenote AI 어시스턴트입니다.
사용자의 질문에 짧고 자연스럽게 답하세요.
사용자 언어가 한국어면 한국어로, 영어면 영어로 답하세요.
간결하고 이해하기 쉽게 답하세요.`;
  return basePrompt;
}

function getSelectedKBOwners() {
  return Array.from(new Set([state.userId, ...state.selectedKBs.filter(uid => uid !== state.userId)]));
}

async function getOwnerChunks(ownerId) {
  const list = await api.kbList(ownerId);
  const ownerCache = state.kbTextCache[ownerId] || (state.kbTextCache[ownerId] = {});
  const chunks = [];

  for (const doc of list.docs) {
    if (!ownerCache[doc.name]) {
      const content = await api.kbContent(ownerId, doc.name);
      ownerCache[doc.name] = content.text;
    }
    chunks.push(...chunkText(ownerCache[doc.name]));
  }

  return chunks;
}

async function getRelevantContext(message) {
  const owners = getSelectedKBOwners();
  const allChunks = [];

  for (const ownerId of owners) {
    try {
      allChunks.push(...await getOwnerChunks(ownerId));
    } catch (error) {
      console.error(error);
    }
  }

  const relevant = simpleRagSearch(message, allChunks, 5);
  return relevant.length ? relevant.join('\n\n---\n\n') : '관련 문서 없음';
}

function extractAssistantText(output, fallbackText) {
  const generated = output?.[0]?.generated_text;
  if (Array.isArray(generated)) {
    const last = generated[generated.length - 1];
    if (last?.role === 'assistant' && typeof last.content === 'string') {
      return last.content;
    }
  }
  if (typeof generated === 'string') return generated;
  return fallbackText;
}

function cleanAssistantText(text) {
  const normalized = String(text || '')
    .replace(/<\|im_end\|>/g, '')
    .replace(/<\|im_start\|>/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  // Collapse obvious repetition loops from very small models.
  const words = normalized.split(' ').filter(Boolean);
  if (words.length >= 8) {
    const deduped = [];
    for (const word of words) {
      const recent = deduped.slice(-4);
      if (recent.length === 4 && recent.every(item => item === word)) {
        continue;
      }
      deduped.push(word);
    }
    return deduped.join(' ').trim();
  }

  return normalized;
}

function isLowQualityResponse(text) {
  const normalized = String(text || '').trim();
  if (!normalized) return true;

  const words = normalized.split(/\s+/).filter(Boolean);
  if (words.length >= 10) {
    const uniqueRatio = new Set(words.map(w => w.toLowerCase())).size / words.length;
    if (uniqueRatio < 0.35) return true;
  }

  if (/(.{2,8})\1{3,}/u.test(normalized.replace(/\s+/g, ''))) {
    return true;
  }

  if (/([A-Za-z가-힣]{1,6})( \1){4,}/u.test(normalized)) {
    return true;
  }

  return false;
}

/* ── Chat send ── */
async function sendChat() {
  if (state.isStreaming) return;
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if (!message) return;

  input.value = '';
  input.style.height = 'auto';

  // Append user message
  appendMsg('user', message);

  // Typing indicator
  const typingEl = document.createElement('div');
  typingEl.className = 'msg assistant';
  typingEl.id = 'typing-msg';
  typingEl.innerHTML = `
    <div class="msg-avatar">AI</div>
    <div class="msg-bubble" style="padding:10px 14px;">
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>`;
  document.getElementById('chat-messages').appendChild(typingEl);
  scrollChat();

  state.isStreaming = true;
  document.getElementById('send-btn').disabled = true;

  async function runInference(bubbleEl) {
    // 1) 모델이 준비될 때까지 대기 (Worker 내부에서 로딩, 메인 스레드 블로킹 없음)
    await ensureModelReady();

    // 2) 대화 이력을 messages 배열로 구성
    const messages = [
      { role: 'system', content: buildSystemPrompt() },
      ...state.chatHistory.slice(-6),
      { role: 'user', content: message },
    ];

    // 3) 추론 요청을 Worker로 위임
    const output = await workerCall('infer', {
      messages,
      maxTokens: state.model.maxTokens || 256,
      temperature: state.model.temperature ?? 0.4,
    });

    // 4) 최종 결과 추출
    const generated = output?.[0]?.generated_text;
    let assistantText = '';
    if (Array.isArray(generated)) {
      const last = generated[generated.length - 1];
      if (last?.role === 'assistant') assistantText = last.content || '';
    } else if (typeof generated === 'string') {
      assistantText = generated;
    }

    bubbleEl.textContent = assistantText.trim();
    scrollChat();
    return assistantText.trim();
  }

  try {
    // Replace typing indicator with Thinking... bubble
    typingEl.remove();
    const aiMsgEl = createMsgEl('assistant', '');
    document.getElementById('chat-messages').appendChild(aiMsgEl);
    const bubbleEl = aiMsgEl.querySelector('.msg-bubble');
    bubbleEl.innerHTML = '<span class="thinking-text">Thinking...</span>';
    scrollChat();

    let assistantText = await runInference(bubbleEl);

    assistantText = cleanAssistantText(assistantText.trim());
    if (isLowQualityResponse(assistantText)) {
      assistantText = '모델 응답이 불안정했어요. 더 짧고 단순하게 다시 질문해 주세요.';
    }
    bubbleEl.textContent = assistantText || '답변을 생성하지 못했어요.';
    scrollChat();

    // Update history
    state.chatHistory.push({ role: 'user', content: message });
    state.chatHistory.push({ role: 'assistant', content: assistantText || '답변을 생성하지 못했어요.' });
    if (state.chatHistory.length > 20) state.chatHistory = state.chatHistory.slice(-20);

  } catch (e) {
    if (typingEl.isConnected) typingEl.remove();
    toast(e.message || '오류가 발생했어요', 'error');
  } finally {
    state.isStreaming = false;
    document.getElementById('send-btn').disabled = false;
  }
}

function appendMsg(role, text) {
  const el = createMsgEl(role, text);
  document.getElementById('chat-messages').appendChild(el);
  scrollChat();
}

function createMsgEl(role, text) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  const label = role === 'user' ? state.userId[0].toUpperCase() : 'AI';
  el.innerHTML = `
    <div class="msg-avatar">${esc(label)}</div>
    <div class="msg-bubble">${esc(text)}</div>`;
  return el;
}

function scrollChat() {
  const c = document.getElementById('chat-messages');
  c.scrollTop = c.scrollHeight;
}

document.getElementById('send-btn').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

// Auto-resize textarea
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

/* ════════════════════════════════════════════════
   UTILS
════════════════════════════════════════════════ */
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1024 / 1024).toFixed(1) + ' MB';
}

function formatDate(ts) {
  return new Date(ts * 1000).toLocaleDateString('ko-KR', {
    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });
}
